name: Tests

on:
  pull_request:
    branches:
      - test
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'media/**'
  push:
    branches:
      - test
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'media/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.17.2

      - name: Ruff check
        run: ruff check . --select E9,F --exclude migrations

  test:
    name: Tests (Django)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://postgres:1234@localhost:5432/mi_db
      SECRET_KEY: ci-only-dummy-key
      DEBUG: 'True'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mi_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (incluye coverage)
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
