[pytest]
DJANGO_SETTINGS_MODULE = RTR.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    tests
    inventario/tests
    ventas/tests
    sucursales/tests
    usuario/tests
    clientes/tests
    producto/tests
    notifications/tests
addopts =
    --cov=. --cov-report=term-missing --cov-report=xml --cov-config=.coveragerc
    --cov-fail-under=98
; ventas/services e inventario/services siguen exigiendo 100% en CI
; (.github/workflows/test.yml), donde vive la lógica de venta y stock.
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
